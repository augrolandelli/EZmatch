server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # DNS interno de Docker, re-resuelto cada 10 s: si la API se redeploya y cambia de IP, nginx la sigue encontrando.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # La API vive en el mismo dominio que el panel (sin CORS).
  # X-Forwarded-For se pasa tal cual lo puso Traefik (IP real del cliente) para el rate limit de login.
  location /api/ {
    set $api_upstream http://api:5000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }

  # Archivos con hash en el nombre: cache larga.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: cualquier ruta del panel devuelve index.html (sin cache, para tomar deploys nuevos al instante).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
