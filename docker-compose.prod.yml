# Docker Compose de producción para Easy Panel / VPS.
# Uso local (con variables en .env):
#   docker compose -f docker-compose.prod.yml up -d --build
#
# En Easy Panel podés subir este archivo y dejar que el panel levante los servicios.
# Nota: Easy Panel gestiona sus propias redes y nombres de contenedor, por eso no se
# definen explícitamente aquí.
#
# IMPORTANTE: en Easypanel los proyectos comparten una red interna, y nombres genéricos como
# "api" o "postgres" chocan con servicios de otros proyectos (ej. CalisApp también tiene "api").
# Por eso los servicios se llaman entre sí SOLO por alias únicos: ezmatch-api y ezmatch-db.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "5000"
    networks:
      default:
        aliases: [ezmatch-api]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # GSS Encryption Mode=Disable: sin esto Npgsql intenta Kerberos, la imagen no trae
      # libgssapi_krb5 y el proceso termina con código 139.
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "Host=ezmatch-db;Port=5432;Database=ezmatch;Username=ezmatch;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable"
      Cors__AllowedOrigins__0: ${FRONTEND_URL}
      Bot__ApiKey: ${BOT_API_KEY}
      Jwt__Key: ${JWT_KEY}
      # SuperAdmin inicial (solo se crea si no existe ninguno).
      AdminSeed__Email: ${ADMIN_EMAIL}
      AdminSeed__Password: ${ADMIN_PASSWORD}
      # Dueño del club demo para probar el panel (opcional).
      Seed__DemoOwnerEmail: ${SEED_DEMO_OWNER_EMAIL:-}
      Seed__DemoOwnerPassword: ${SEED_DEMO_OWNER_PASSWORD:-}
      # Club demo para probar el bot antes de tener el panel (Fase 2). Desactivar con un club real.
      Seed__DemoClub: ${SEED_DEMO_CLUB:-false}
      Seed__ChatwootInboxId: ${SEED_CHATWOOT_INBOX_ID:-}
    depends_on:
      postgres:
        condition: service_healthy

  # Panel web (nginx): sirve el frontend y proxea /api a la API. En Easypanel, el dominio del panel apunta acá (puerto 80).
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api

  postgres:
    image: postgres:17
    restart: unless-stopped
    networks:
      default:
        aliases: [ezmatch-db]
    environment:
      POSTGRES_DB: ezmatch
      POSTGRES_USER: ezmatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U ezmatch -d ezmatch
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
